# W-TELEGRAM-01 monitor thresholds. Sourced by the alert engine / daily
# summary / watchdog. Plain KEY=VALUE (shell + python readable). No secrets
# here — TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID live in ~/.kalshi/env.sh only.

# --- red thresholds ---
DISK_RED_PCT=85
CHRONY_OFFSET_RED_S=0.5
BALANCE_POLL_MIN=5            # balance tripwire poll cadence (minutes)
BALANCE_FAIL_YELLOW=3         # consecutive balance-read failures -> yellow

# --- yellow thresholds ---
CAPTURE_GAP_YELLOW=1          # any capture gap -> yellow (engine reads capture_alert.json)
W09_IDLE_YELLOW_H=2           # W09 powered on & idle > N hours -> yellow (cost)
EVENT_VOL_DEV_PCT=50          # daily event count deviates from 7d mean by ±N% -> yellow

# --- feed / freshness ---
FEED_STALE_S=120             # newest raw file older than N s -> capture-down class

# --- cost budget ---
COST_MONTH_BUDGET_USD=50     # monthly spend cap; touching it (auto-publish paused) -> red

# --- research bucket / deep03 countdown ---
RESEARCH_DATE_TARGET=20      # qualified independent dates needed for deep03 verdict tier

# --- daily summary ---
SUMMARY_HOUR_UTC=12          # 12:00 UTC = 20:00 Beijing
SUMMARY_STALE_RED_H=26       # watchdog: no summary in N hours -> backup-channel red

# --- anti-spam ---
REALERT_MIN=30               # re-send a still-bad condition every N minutes

# --- upstream intel sources (§4-ter) ---
CHANGELOG_URL=https://docs.kalshi.com/changelog
ANNOUNCE_URL=https://news.kalshi.com/t/announcements
ANNOUNCE_KEYWORDS=fee,fees,market launch,new market,trading rules,protection,settlement,API
CHANGE_CALENDAR_LOOKAHEAD_DAYS=14

# --- §4-bis cognitive-health (PRE-EMBEDDED, NOT ACTIVE until shadow) ---
COGNITIVE_HEALTH_ACTIVE=0    # master switch; stays 0 until shadow phase
FILL_TOO_GOOD_ZSCORE=3.0     # fill rate above backtest band by this many sd -> red (inactive)
SELF_VOLUME_SHARE_RED=0.25   # our fills > N of market rolling volume -> red (inactive)
BACKTEST_SHADOW_DRIFT=0.0    # shadow-vs-replay markout drift threshold (inactive; tune at shadow)
