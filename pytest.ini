# pytest scaffold (EXECUTION_PLAN WP-00). New contract suites (WP-04, gold
# W-streams) are pytest-native and auto-collected from tests/. Legacy suites
# remain canonical under `make check` / tests/run_pipeline.sh and are excluded
# in tests/conftest.py until WP-04 migrates them deliberately (A1: one test
# infrastructure — every pytest suite also gets a tools.json entry and a
# run_pipeline.sh line when it lands).
[pytest]
testpaths = tests
addopts = -q
