  usage_tier: advanced
  grants: [{instance: event_contract, level: advanced, source: manual, expires: permanent}]
  read_bucket: {refill_tokens_per_s: 300, capacity_tokens: 600}
  write_bucket: {refill_tokens_per_s: 300, capacity_tokens: 600}
  default_endpoint_cost_tokens: 10
  notable_costs:  # VERIFIED-LIVE (endpoint_costs); full table in account_info output
    "DELETE /portfolio/events/orders/:order_id": 2
    "DELETE /portfolio/events/orders/batched": 2   # per item
    "GET /portfolio/orders/:order_id": 2
  batch_billing: "per item; whole batch must fit the bucket at once or the entire batch rejects"  # DOCS-ONLY: getting_started/rate_limits.md
  burst: "capacity = 2s of budget for Advanced read + write (600 = 2 x 300); idle 2s then burst 2x budget"  # VERIFIED-LIVE capacity + DOCS-ONLY semantics
  quota_headers: none   # VERIFIED-LIVE: 200 response carries no X-RateLimit-*/Retry-After (sandbox/discovery/rest_headers_output.txt); docs confirm 429 has none either
  http_429_body: '{"error": "too many requests"}'  # DOCS-ONLY: getting_started/rate_limits.md

endpoints:
  evidence: "DOCS-ONLY: docs/vendor/kalshi/latest/openapi.yaml (sha256 557683c9...) + VERIFIED-CODE include/kalshi/wire.hpp:155"
  create_order: {path: "POST /portfolio/events/orders", exists: true}
  batch_create: {path: "POST /portfolio/events/orders/batched", exists: true}
  cancel_order: {path: "DELETE /portfolio/events/orders/{order_id}", exists: true}
  batch_cancel: {path: "DELETE /portfolio/events/orders/batched", exists: true}
  amend_order: {path: "POST /portfolio/events/orders/{order_id}/amend", exists: true}
  decrease_order: {path: "POST /portfolio/events/orders/{order_id}/decrease", exists: true}
  cancel_all: {exists: false, note: "no global cancel-all; nearest primitives are batch-cancel and order-group trigger/delete (cancels all resting orders in the group)"}
  order_groups: {exists: true, note: "server-side dead-man: rolling 15s contract limit; trigger/delete cancels all resting orders in group"}  # DOCS-ONLY: getting_started/order_groups.md
  legacy_create_removed: true   # POST /portfolio/orders absent from current spec; fixed-point migration removed it
  time_in_force_enum: [fill_or_kill, good_till_canceled, immediate_or_cancel]
  self_trade_prevention_enum: [taker_at_cross, maker]   # required on create
  side_enum: [bid, ask]   # YES-normalized book; bid = buy YES economics
  price_format: "fixed-point dollar string, up to 6 dp accepted; valid ticks per market price_level_structure (linear_cent | tapered_deci_cent | deci_cent)"
  count_format: "fixed-point contract count string, 0-2 dp (fractional contracts allowed)"
  cancel_order_on_pause: {field: cancel_order_on_pause, default: false}   # DOCS-ONLY: maintenance_and_pauses.md
  exchange_index: {default: 0, auto_route: -1, prod_live_shards: [0]}   # VERIFIED-LIVE: prod /exchange/status shows shard 0 only; demo shows 0 and 1

