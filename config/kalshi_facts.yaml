fees:
  # Official schedule: https://kalshi.com/docs/kalshi-fee-schedule.pdf
  # NOTE: the PDF was UPDATED "7.7.26" (title indexed by search engines:
  # "Fee Schedule for July 2026 - 7.7.26 Update"). Live PDF remains bot-gated
  # (429; archive.org's own crawler has been blocked since 2026-03, so the
  # last full PDF snapshot is 2026-02-18, sha256
  # b1a37aa734771f42929ccd9ba90ab845e07303f03f549f1c2f493c08b13d2fc9,
  # sandbox/discovery/fee_schedule_text_clean.txt).
  # OQ-1 RATIFIED 2026-07-16 (operator delegated resolution in-session;
  # ruling D-4 in docs/PLAN_SPORTS_TRADING_DECISIONS.md). Evidence chain
  # replacing the single-archived-PDF provenance:
  #   1. archive.org snapshot of kalshi.com/fee-schedule 2026-05-08: standard
  #      markets multiplier x1, fee range per 100 contracts $0.07-$1.75 taker
  #      (= 0.07*P*(1-P) at P=0.01..0.50 exactly); "No upcoming fee changes".
  #   2. Search-engine index of the LIVE 7.7.26 PDF: prediction-market
  #      formula unchanged (round_up(0.07*C*P*(1-P)), max $1.75/100, no
  #      settlement fee); the 7.7.26 changes = tiered bps fees for PERPETUAL
  #      FUTURES (separate product line, margin API) + refreshed non-standard
  #      multiplier table (mitigated by per_series_lookup below — Q3 already
  #      forbids assuming x1/quadratic).
  #   3. Two independent 2026 guides (pm.wiki 2026-04-21; marketmath.io
  #      2026-07-16): taker 7%*P*(1-P), maker 1.75%*P*(1-P) (=25% of taker).
  #   4. LIVE API 2026-07-16: GET /series/fee_changes -> EMPTY (no scheduled
  #      changes); per-series fee_type/fee_multiplier examples re-verified
  #      (see examples below).
  #   5. Live docs.kalshi.com/getting_started/fee_rounding (2026-07-16):
  #      rounding regime unchanged (ceil to $0.0001, $0.01 rebate accumulator).
  # RESIDUAL RISK (stated, accepted in D-4): the live 7.7.26 PDF body itself
  # is unread by us; per-series scoping MUST keep coming from the API lookup
  # (never this file) — that path is live-verified and is the runtime truth.
  verified: true
  evidence: "OQ-1 ratified 2026-07-16, D-4 in PLAN_SPORTS_TRADING_DECISIONS.md: archive.org fee-schedule page 2026-05-08 + live API fee_changes EMPTY + live fee_rounding.md + 2x independent 2026 guides; constants 0.07/0.0175 multi-source confirmed; live 7.7.26 PDF body unread (bot-gated), per-series scoping stays API-sourced"
  formula: "trade_fee = ceil_to_centicent(rate * fee_multiplier * C * P * (1 - P))"
  params:
    taker_rate: 0.07        # all markets (fee_type quadratic and quadratic_with_maker_fees)
    maker_rate: 0.0175      # ONLY on series with fee_type == quadratic_with_maker_fees
    P: "contract price in dollars (0.50 = 50c)"
    C: "number of contracts (fractional allowed since fixed-point migration)"
  rounding:
    # The Feb-2026 PDF says "round up to the next cent"; the CURRENT rounding
    # regime (post fixed-point migration) supersedes it: trade fee is ceiled
    # to the nearest $0.0001 (centicent), then a rounding fee restores the
    # member's balance precision ($0.01 non-direct / $0.0001 direct) with a
    # per-order accumulator issuing whole-cent rebates. See report §1.4.
    trade_fee_ceil: "$0.0001 (centicent)"
    balance_precision_non_direct: "$0.01"
    balance_precision_direct: "$0.0001"
    accumulator_rebate: "$0.01 whole-cent rebates once accumulated rounding > $0.01, per order across fills"
    evidence: "DOCS-ONLY: docs.kalshi.com/getting_started/fee_rounding.md (fetched live 2026-07-07)"
  fee_type_enum: [quadratic, quadratic_with_maker_fees, flat]   # DOCS-ONLY: openapi.yaml FeeType
  per_series_lookup:
    # fee_type + fee_multiplier come from GET /series/{ticker}; never assume 0 maker fee.
    endpoint: "GET /trade-api/v2/series/{ticker} -> series.fee_type, series.fee_multiplier"
    examples:  # VERIFIED-LIVE 2026-07-07, re-verified 2026-07-16 (prod, unauthenticated GET)
      KXBTCD: {fee_type: quadratic, fee_multiplier: 1}
      KXNBA: {fee_type: quadratic_with_maker_fees, fee_multiplier: 1}
      KXATPMATCH: {fee_type: quadratic_with_maker_fees, fee_multiplier: 1}  # VERIFIED-LIVE 2026-07-16
      KXWTAMATCH: {fee_type: quadratic_with_maker_fees, fee_multiplier: 1}  # VERIFIED-LIVE 2026-07-16
      KXATP: {fee_type: quadratic, fee_multiplier: 1}  # tournament-winner series, NO maker fee — VERIFIED-LIVE 2026-07-16
    scheduled_changes: "GET /series/fee_changes + GET /events fee overrides (fee_type_override, fee_multiplier_override)"
  other_fees:  # DOCS-ONLY: official schedule PDF
    settlement: 0
    membership: 0
    resting_order_cancel: 0

